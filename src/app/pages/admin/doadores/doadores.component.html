<table class="table table-striped">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Nome Completo</th>
      <th scope="col">Email</th>
      <th scope="col">Telefone</th>
      <th scope="col">CPF</th>
      <th scope="col">Tipo</th>
      <th scope="col">Nome da Empresa</th>
      <th scope="col">CNPJ</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let doador of doadores; let i = index">
      <th scope="row">{{ i + 1 }}</th>
      <td>{{ doador.nomeCompleto }}</td>
      <td>{{ doador.email }}</td>
      <td>{{ doador.telefone }}</td>
      <td>{{ doador.cpf || "—" }}</td>
      <td>{{ doador.tipo }}</td>
      <td>{{ doador.nomeEmpresa || "—" }}</td>
      <td>{{ doador.cnpj || "—" }}</td>
    </tr>
  </tbody>
</table>
