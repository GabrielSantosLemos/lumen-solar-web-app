<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">Faça uma Doação</h4>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="onFechar()"
  ></button>
</div>

<div class="modal-body">
  <form (ngSubmit)="confirmarDoacao()" #formDoacao="ngForm">
    <div class="mb-3">
      <label for="valor" class="form-label">Valor da Doação (R$)</label>
      <input
        type="number"
        id="valor"
        class="form-control"
        name="valor"
        [(ngModel)]="valorDoacao"
        required
        min="1"
        step="0.01"
        placeholder="Ex: 50.00"
      />
    </div>

    <button
      type="submit"
      class="btn btn-success w-100"
      [disabled]="formDoacao.invalid"
    >
      Confirmar Doação
    </button>
  </form>

  <div *ngIf="mensagem" class="alert alert-info mt-3 text-center">
    {{ mensagem }}
  </div>
</div>
