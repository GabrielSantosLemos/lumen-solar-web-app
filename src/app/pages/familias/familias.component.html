<div class="container">

    <h3>Família</h3>
  </div>

    <ng-container ngbNavItem [ngbNavItem]="0">
      <button ngbNavLink>Ficha de Inscrição</button>
      <ng-template ngbNavContent>
        <app-editar></app-editar>
      </ng-template>
    </ng-container>

      <a ngbNavLink>Situação do Auxílio</a>
      <ng-template ngbNavContent>
        <app-situacao></app-situacao>
      </ng-template>
    </ng-container>

  <div [ngbNavOutlet]="nav" class="mt-2"></div>
</div>
